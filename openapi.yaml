    get:
      summary: Helper Metrics
      description: Return privacy-safe tutor queue and response-time totals.
      operationId: helper_metrics_api_v1_helper_metrics_get
      parameters:
      - name: x-helper-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Helper-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Helper Metrics Api V1 Helper Metrics Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/helper/content-health:
    get:
      summary: Helper Content Health
      description: Check indexed course records for missing evidence and locale
        coverage.
      operationId: helper_content_health_api_v1_helper_content_health_get
      parameters:
      - name: x-helper-token
