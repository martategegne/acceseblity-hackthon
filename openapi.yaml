        return TwiML XML. In live Twilio webhook mode, send form data and a valid
        X-Twilio-Signature header.
      operationId: voice_call_answer_api_v1_voice_call_answer_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SpeechResult:
                  type: string
                Confidence:
                  type: number
                From:
                  type: string
                CallSid:
                  type: string
              additionalProperties:
                type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/xml:
              schema:
                type: string
