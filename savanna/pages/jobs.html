<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Jobs and Practice Opportunities — Savanna</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; margin: 0; padding: 0; background: #fdfdfd; }
    header.nav-header { background: #002b56; color: white; padding: 12px 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    nav.lesson-nav { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; }
    nav.lesson-nav a { color: #f0f4f8; text-decoration: none; padding: 4px 8px; border-radius: 4px; }
    nav.lesson-nav a:hover, nav.lesson-nav a:focus { background: rgba(255,255,255,0.15); text-decoration: underline; }
    main.lesson-body { max-width: 800px; margin: 32px auto; padding: 0 20px 80px; }
    h1.lesson-title { font-size: 2rem; color: #002b56; margin-bottom: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
    section.lesson-section { margin-top: 36px; padding-top: 12px; }
    h2.section-heading { font-size: 1.5rem; color: #0f172a; margin-bottom: 12px; scroll-margin-top: 60px; }
    p { margin: 0 0 16px; color: #334155; }
    .job-card { margin-block: 1rem; padding: 1rem; border: 1px solid #cbd5e1; border-radius: .5rem; background: #fff; }
    .job-card h2 { margin-block: 0 .35rem; color: #0f172a; font-size: 1.25rem; }
    .job-card ul { padding-inline-start: 1.4rem; }
    .job-card a { color: #003f79; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 1rem; background: #e5eef7; color: #123e67; font-weight: 700; font-size: .85rem; }
    :focus-visible { outline: 3px solid #b04a00; outline-offset: 3px; }
  </style>
</head>
<body>
  <header class="nav-header">
    <nav class="lesson-nav" aria-label="Savanna pages">
      <a href="concept-with-navigation.html">Course lesson</a>
      <a href="#jobs">Test jobs</a>
    </nav>
  </header>
  <main class="lesson-body">
    <h1 class="lesson-title">Career gateway: test jobs</h1>
    <p>These eight fictional TEST listings are practice examples only. They are not real vacancies, employers, or people.</p>
    <p id="job-status" role="status" aria-live="polite">Loading test jobs…</p>
    <section id="jobs" aria-label="Test job listings"></section>
  </main>
  <script>
    (async () => {
      const list = document.getElementById("jobs");
      const status = document.getElementById("job-status");
      try {
        const response = await fetch("../../demo/data/jobs.json");
        if (!response.ok) throw new Error("Jobs could not be loaded.");
        const jobs = await response.json();
        if (!Array.isArray(jobs)) throw new Error("Jobs data must be a list.");
        const structuredData = document.createElement("script");
        structuredData.type = "application/ld+json";
        structuredData.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@graph": jobs.map((job) => ({
            "@type": "JobPosting",
            identifier: { "@type": "PropertyValue", name: job.employer, value: job.id },
            title: job.title,
            description: job.description,
            url: new URL(job.url, window.location.href).href,
            hiringOrganization: { "@type": "Organization", name: job.employer },
            jobLocation: { "@type": "Place", name: job.location },
            ...(job.remote ? { jobLocationType: "TELECOMMUTE" } : {}),
            ...(Array.isArray(job.accommodations) ? { jobBenefits: job.accommodations } : {})
          }))
        });
        document.head.append(structuredData);
        for (const job of jobs) {
          const article = document.createElement("article"); article.className = "job-card"; article.id = job.id;
          const title = document.createElement("h2"); title.textContent = job.title; article.append(title);
          const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "TEST listing"; article.append(badge);
          const details = document.createElement("p"); details.textContent = `${job.employer} · ${job.location} · ${job.remote ? "Remote" : "On site"}`; article.append(details);
          const description = document.createElement("p"); description.textContent = job.description; article.append(description);
          const accommodationsTitle = document.createElement("h3"); accommodationsTitle.textContent = "Available interview and work accommodations"; article.append(accommodationsTitle);
          const accommodations = document.createElement("ul");
          for (const item of job.accommodations) { const li = document.createElement("li"); li.textContent = item; accommodations.append(li); }
          article.append(accommodations);
          const link = document.createElement("a"); link.href = job.url; link.textContent = "View this test listing"; article.append(link);
          list.append(article);
        }
        status.textContent = `${jobs.length} TEST jobs loaded.`;
      } catch (error) { status.textContent = error.message; }
    })();
  </script>
  <script src="../../module/db-assistant.min.js?v=16"></script>
  <db-assistant lang="en"></db-assistant>
</body>
</html>
